# Database Configuration for MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/online_banking_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Enable SQL initialization scripts if needed
spring.sql.init.mode=always

# JWT Configuration
app.jwt.secret=9a2f8c4e7b1a6d5c3e9f8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b8c7d
app.jwt.expiration-ms=86400000

# Server Port
server.port=8080
